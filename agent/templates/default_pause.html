<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#edf2fa"><title>{{TITLE}}</title>
<style>
:root{color-scheme:light dark;--bg:#edf2fa;--card:#ffffffec;--ink:#17243c;--muted:#65758e;--line:#dfe7f2;--accent:#4267df}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 15% 10%,#dce6ff 0,transparent 50%),radial-gradient(ellipse at 95% 90%,#d9f3ed 0,transparent 45%),var(--bg)}
main{width:min(100%,620px);padding:48px;border:1px solid #ffffffa0;border-radius:28px;background:var(--card);box-shadow:0 25px 85px #243c6812;position:relative;overflow:hidden}
.status{display:inline-flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--muted);font-size:11px;letter-spacing:.12em;font-weight:650}.dot{width:6px;height:6px;background:var(--accent);border-radius:50%}.code{font-size:clamp(80px,19vw,132px);line-height:1.15;letter-spacing:-.07em;font-weight:750;color:var(--accent);margin:32px 0 16px;font-variant-numeric:tabular-nums}
h1{font-size:clamp(22px,4vw,29px);letter-spacing:-.035em;line-height:1.5;margin:0 0 14px}p{color:var(--muted);font-size:14px;line-height:1.9;margin:0;max-width:44ch}.actions{margin:30px 0 36px}a{display:inline-flex;gap:10px;align-items:center;text-decoration:none;color:white;background:var(--accent);padding:12px 19px;border-radius:11px;font-size:13px;font-weight:600}a:hover{filter:brightness(1.1)}a:focus-visible{outline:3px solid var(--ink);outline-offset:4px}footer{padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:10px;letter-spacing:.06em}.mark{font-weight:750;color:var(--ink)}
@media(prefers-color-scheme:dark){:root{--bg:#101827;--card:#172236f0;--ink:#e7eefb;--muted:#a4b2ca;--line:#2d3d55;--accent:#8ba9ff}body{background:radial-gradient(ellipse at 15% 10%,#243963 0,transparent 50%),radial-gradient(ellipse at 95% 90%,#193f43 0,transparent 45%),var(--bg)}main{border-color:#30405a}a{color:#10213f}}
@media(max-width:480px){body{padding:16px}main{padding:30px 25px;border-radius:22px}footer{flex-wrap:wrap}}
</style></head>
<body><main aria-labelledby="page-title"><span class="status"><span class="dot"></span>SITE NOTICE</span><div class="code" aria-label="HTTP {{CODE}}">{{CODE}}</div><h1 id="page-title">{{TITLE}}</h1><p>{{MESSAGE}}</p><div class="actions"><a href=""><span aria-hidden="true">↻</span>もう一度読み込む</a></div><footer><span class="mark">SITE STATUS</span><span>HTTP {{CODE}} · Please check back later</span></footer></main></body>
</html>
