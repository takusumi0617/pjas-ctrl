<VirtualHost *:443>
    ServerName chat.example.com
    DocumentRoot /var/www/pjas-chat/dist
    <Directory /var/www/pjas-chat/dist>
        Require all granted
        FallbackResource /index.html
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    </Directory>
    ProxyPass /ws ws://127.0.0.1:8081
    ProxyPassReverse /ws ws://127.0.0.1:8081
    ProxyPassMatch ^/api(?:/.*)?$ unix:/run/php/php8.4-fpm.sock|fcgi://localhost/var/www/pjas-chat/api/index.php
    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/memo.takusumi.work.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/memo.takusumi.work.key
</VirtualHost>
