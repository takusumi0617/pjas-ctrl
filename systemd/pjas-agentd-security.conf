[Service]
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectKernelLogs=yes
ProtectClock=yes
RestrictSUIDSGID=yes
UMask=0022
# 配置物の所有者変更・非特権実行は必要。カーネル・ネットワーク管理権限は不要。
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER CAP_KILL CAP_SETGID CAP_SETUID
AmbientCapabilities=
# 公開ファイルを生成するため既定umaskは0022。秘密ファイルは各処理が0600/0700を指定。
SystemCallFilter=~@mount @reboot @swap @raw-io @module @clock @debug
SystemCallErrorNumber=EPERM
