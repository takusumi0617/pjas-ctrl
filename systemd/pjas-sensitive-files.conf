# Block accidental static disclosure. Authenticated application downloads are unaffected.
<FilesMatch "(?i)(?:^\.env(?:\..*)?$|^\.pjas$|\.(?:db|sqlite|sqlite3)(?:-(?:wal|shm|journal))?$|\.(?:key|pem|p12|pfx|sql|bak|log)$|~$)">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(?:git|svn|hg)(?:/|$)">
    Require all denied
</DirectoryMatch>
# Reject sensitive URLs before proxying/routing, including vhosts with <Location /> grants.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteOptions InheritDownBefore
    RewriteRule "(?i)(?:^|/)(?:\.env(?:\.[^/]*)?|\.pjas|[^/]+\.(?:db|sqlite|sqlite3)(?:-(?:wal|shm|journal))?|[^/]+\.(?:key|pem|p12|pfx|sql|bak|log)|[^/]+~)$" "-" [F,END]
    RewriteRule "(?i)(?:^|/)\.(?:git|svn|hg)(?:/|$)" "-" [F,END]
</IfModule>
<LocationMatch "(?i)(?:(?:^|/)(?:\.env(?:\.[^/]*)?|\.pjas|[^/]+\.(?:db|sqlite|sqlite3)(?:-(?:wal|shm|journal))?|[^/]+\.(?:key|pem|p12|pfx|sql|bak|log)|[^/]+~)$|(?:^|/)\.(?:git|svn|hg)(?:/|$))">
    Require all denied
</LocationMatch>
