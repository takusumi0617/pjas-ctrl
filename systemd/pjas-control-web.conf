ServerRoot /etc/apache2
ServerName localhost
PidFile /run/pjas-control-web/httpd.pid
DefaultRuntimeDir /run/pjas-control-web
Mutex file:/run/pjas-control-web default
Listen 127.0.0.1:8184
User pjas-control
Group pjas-control
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_fcgi_module /usr/lib/apache2/modules/mod_proxy_fcgi.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 127.0.0.1
TypesConfig /etc/mime.types
<Directory />
    Require all denied
    AllowOverride None
    Options None
</Directory>
ErrorLog /var/log/pjas/control-web-error.log
LogLevel warn
ProxyTimeout 900
<VirtualHost 127.0.0.1:8184>
    DocumentRoot /opt/pjas-ctrl/public
    DirectoryIndex index.php
    <Directory /opt/pjas-ctrl/public>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/pjas-control.sock|fcgi://localhost"
    </FilesMatch>
    <FilesMatch "^\." >
        Require all denied
    </FilesMatch>
</VirtualHost>
