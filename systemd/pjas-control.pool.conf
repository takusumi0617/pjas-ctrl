; Dedicated control panel PHP pool. Production www-data cannot access this socket.
[pjas-control]
user = pjas-control
group = pjas-control
listen = /run/php/pjas-control.sock
listen.owner = pjas-control
listen.group = pjas-control
listen.mode = 0660
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
clear_env = yes
security.limit_extensions = .php
php_admin_value[cgi.fix_pathinfo] = 0
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 520M
php_admin_value[max_execution_time] = 0
