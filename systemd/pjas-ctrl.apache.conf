# pjas-ctrl 自身の vhost。管理面なので公開せず、社内 NW / VPN からのみ到達させる。
# /etc/apache2/sites-available/pjas-ctrl.conf として配置し a2ensite pjas-ctrl

<VirtualHost *:443>
    ServerName ctrl.pjas.example

    DocumentRoot /opt/pjas-ctrl/public
    <Directory /opt/pjas-ctrl/public>
        AllowOverride None
        Require all granted
        Options -Indexes +FollowSymLinks

        # フロントコントローラへ集約
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # 管理画面はアクセス元を絞る (例: 社内 NW と VPN のみ)
    <Location />
        Require ip 10.0.0.0/8
        Require ip 192.168.0.0/16
    </Location>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # SSE (ジョブログ) をバッファさせない
    <LocationMatch "^/jobs/[0-9]+/stream$">
        SetEnv no-gzip 1
        SetEnv proxy-nokeepalive 1
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/pjas-ctrl-error.log
    CustomLog ${APACHE_LOG_DIR}/pjas-ctrl-access.log combined

    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare/memo.takusumi.work.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/memo.takusumi.work.key
</VirtualHost>
