<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>{{TITLE}}</title><style>
:root{--bg:#edf2fa;--panel:#fff;--fg:#17243c;--muted:#65758e;--line:#dfe7f2;--accent:#4267df;--glow:#dce6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;padding:28px;display:grid;place-items:center;font:14px/1.9 system-ui,-apple-system,sans-serif;color:var(--fg);background:radial-gradient(ellipse at 10% 5%,var(--glow),transparent 60%),var(--bg)}main{width:min(100%,620px);min-width:0;padding:44px 48px;border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:0 24px 80px #17243c0d}.label{font-size:11px;letter-spacing:.14em;color:var(--muted)}.code{margin:30px 0 14px;font-size:clamp(80px,19vw,132px);font-weight:750;line-height:1.15;letter-spacing:-.07em;color:var(--accent)}h1{margin:0 0 14px;font-size:clamp(22px,4vw,29px);line-height:1.5;letter-spacing:-.035em}p{margin:0;color:var(--muted);overflow-wrap:anywhere}.actions{margin:30px 0 36px}a{display:inline-block;padding:11px 17px;border-radius:11px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}a:hover{filter:brightness(1.1)}a:focus-visible{outline:3px solid var(--fg);outline-offset:4px}footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
@media(prefers-color-scheme:dark){:root{--bg:#101827;--panel:#191d24;--fg:#e7eefb;--muted:#a4b2ca;--line:#2d3d55;--accent:#8ba9ff;--glow:#243963}a{color:#10213f}}
@media(max-width:480px){body{padding:16px}main{padding:30px 25px;border-radius:22px}}
</style></head><body><main aria-labelledby="error-title"><span class="label">SITE NOTICE</span><div class="code" aria-label="HTTP {{CODE}}">{{CODE}}</div><h1 id="error-title">{{TITLE}}</h1><p>{{MESSAGE}}</p><div class="actions"><a href="/">ホームに戻る →</a></div><footer><span>お困りのときはサイト管理者へ</span><span>HTTP {{CODE}}</span></footer></main></body></html>
