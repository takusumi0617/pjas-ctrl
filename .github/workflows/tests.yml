name: PHP・Python回帰テスト
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        php: ['8.4', '8.5']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, openssl, pcntl, posix
          coverage: none
      - name: 非特権の専用テストユーザーを準備
        run: |
          sudo apt-get update
          sudo apt-get install -y acl
          sudo useradd --create-home --user-group pjas-test
          sudo install -d -o pjas-test -g pjas-test /tmp/pjas-ctrl-tests
          git archive HEAD | sudo -u pjas-test tar -x -C /tmp/pjas-ctrl-tests
      - name: PHP構文・回帰テストとPythonの検証
        run: |
          sudo -u pjas-test env PJAS_TEST_ROOT=/tmp/pjas-ctrl-tests bash <<'BASH'
          set -euo pipefail
          umask 0022
          cd "$PJAS_TEST_ROOT"
          find agent app shared views tests public -name '*.php' -print0 | xargs -0 -n1 php -l
          for file in bin/pjas-*; do
            if head -1 "$file" | grep -q php; then php -l "$file"; fi
          done
          for test in tests/*.php; do php "$test"; done
          PJAS_COMPONENT_TEST_TYPE=php php tests/components_workflow.php
          python3 tests/security_archives.py
          python3 tests/component_files.py
          python3 tests/isolate_tree.py
          BASH
